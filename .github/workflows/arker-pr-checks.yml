# Arker-owned PR checks (SOC 2 change management): build and unit-test what
# arker-app ships from this repo, on every PR to arker-patches. arker-app's
# release build compiles cloud-hypervisor and ch-remote from this tree
# (aws/release/build-and-install.sh: `cargo build --release --target
# x86_64-unknown-linux-gnu --bin cloud-hypervisor --bin ch-remote`); this job
# does the same (LTO off and parallel codegen, to keep it fast), then runs unit
# tests that need no /dev/kvm. Upstream's ci.yaml is disabled on this fork (its
# integration jobs need upstream's runners). Kept separate from upstream CI files
# so rebases onto upstream never conflict.
name: arker-pr-checks
on:
  pull_request:
    branches: [arker-patches]
permissions:
  contents: read
concurrency:
  group: arker-pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build cloud-hypervisor and ch-remote as arker-app does
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu --bin cloud-hypervisor --bin ch-remote
      - name: Unit tests (no KVM needed)
        # vmm's unit tests are not run: they no longer compile on arker-patches
        # (VfioDeviceFd::try_clone), pre-existing; fixing them is separate work.
        run: cargo test --locked --lib -p option_parser -p vm-allocator -p rate_limiter -p serial_buffer
